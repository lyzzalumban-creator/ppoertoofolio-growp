name: Update harga harian

on:
  schedule:
    # 4 kali sehari. UTC -> WIB (+7): 18.30 -> 01.30, 00.30 -> 07.30, 06.30 -> 13.30, 12.30 -> 19.30.
    # 07.30 menangkap penutupan bursa AS (tutup ±03.00-04.00 WIB) dan kripto pagi; 19.30 menangkap penutupan
    # IDX (tutup ±16.00 WIB); 13.30 dan 01.30 memberi pembaruan di tengah sesi. Satu tanggal tetap satu snapshot:
    # run berikutnya di hari yang sama menimpanya. GitHub boleh terlambat beberapa menit.
    - cron: "30 0,6,12,18 * * *"
  workflow_dispatch: {} # tombol "Run workflow" manual

permissions:
  contents: read # tidak ada yang ditulis ke repo; hasilnya masuk ke Google Sheet

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # run pertama dengan tanggal beli lama mengisi riwayat mundur: satu panggilan per hari (maks 366)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ambil harga & simpan snapshot ke Sheet
        run: node scripts/update.mjs
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          # Opsional (demo key CoinGecko gratis). Kosong = tanpa key.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
