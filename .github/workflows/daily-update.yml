name: Update harga harian

on:
  schedule:
    # 00:30 UTC = 07:30 WIB: setelah IDX (tutup ±16.00 WIB) dan bursa AS (tutup ±03.00-04.00 WIB) sama-sama selesai.
    - cron: "30 0 * * *"
  workflow_dispatch: {} # tombol "Run workflow" manual

permissions:
  contents: read # tidak ada yang ditulis ke repo; hasilnya masuk ke Google Sheet

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # run pertama dengan tanggal beli lama mengisi riwayat mundur: satu panggilan per hari (maks 366)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ambil harga & simpan snapshot ke Sheet
        run: node scripts/update.mjs
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          # Opsional (demo key CoinGecko gratis). Kosong = tanpa key.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
