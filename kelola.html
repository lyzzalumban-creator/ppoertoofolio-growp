<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Kelola aset</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e7490'/%3E%3Cpath d='M6 22l7-8 5 5 8-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>Kelola aset</h1>
        <p class="sub" id="status" role="status">Memuat…</p>
      </div>
      <a class="btn" href="index.html">← Dasbor</a>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <section class="card" id="list-card" hidden>
      <div class="card-head">
        <h2>Daftar aset</h2>
        <button id="add" class="btn primary" type="button">+ Tambah aset</button>
      </div>
      <ul id="assets" class="assets"></ul>
    </section>
  </main>

  <dialog id="dlg" aria-labelledby="dlg-h">
    <form id="form" class="form" novalidate>
      <h2 id="dlg-h">Tambah aset</h2>

      <label class="field"><span>Jenis</span>
        <select id="f-type">
          <option value="idx">Saham IDX</option>
          <option value="us">Saham AS</option>
          <option value="crypto">Kripto</option>
          <option value="gold">Emas</option>
          <option value="manual">Lainnya (reksa dana, deposito, kas)</option>
        </select>
      </label>
      <label class="field"><span id="l-symbol">Kode</span><input id="f-symbol" autocomplete="off" autocapitalize="characters"></label>
      <label class="field"><span>Nama (opsional)</span><input id="f-name" autocomplete="off"></label>
      <label class="field" data-for="crypto"><span>ID CoinGecko (mis. bitcoin)</span><input id="f-coingeckoId" autocomplete="off" autocapitalize="none"></label>
      <label class="field"><span id="l-qty">Jumlah</span><input id="f-qty" type="number" step="any" min="0" inputmode="decimal"></label>
      <label class="field"><span id="l-cost">Harga beli rata-rata</span><input id="f-avgCost" type="number" step="any" min="0" inputmode="decimal"></label>
      <label class="field" data-for="manual"><span>Harga per unit saat ini (kamu perbarui sendiri)</span><input id="f-price" type="number" step="any" min="0" inputmode="decimal"></label>
      <label class="field" data-for="manual"><span>Mata uang</span>
        <select id="f-currency"><option value="IDR">Rupiah (IDR)</option><option value="USD">Dolar (USD)</option></select>
      </label>

      <details class="adv">
        <summary>Opsi lanjutan</summary>
        <label class="field"><span>Total modal dalam rupiah (isi bila ingin untung/rugi aset dolar memperhitungkan kurs saat beli)</span><input id="f-costIdr" type="number" step="any" min="0" inputmode="decimal"></label>
        <label class="field"><span>Simbol Yahoo Finance (hanya bila ticker tidak biasa, mis. BRK-B)</span><input id="f-yahoo" autocomplete="off" autocapitalize="characters"></label>
      </details>

      <p id="f-err" class="err" role="alert" hidden></p>
      <div class="row">
        <button id="cancel" class="btn" type="button">Batal</button>
        <button id="save" class="btn primary" type="submit">Simpan</button>
      </div>
    </form>
  </dialog>

  <script src="assets/nofile.js"></script>
  <script type="module" src="assets/kelola.js"></script>
</body>
</html>
